services:
  api:
    build: .
    container_name: construct-editor-api
    restart: unless-stopped
    # Reads DATABASE_URL (Neon), JWT_SECRET, CORS_ORIGIN, etc. from .env.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 8787
    networks:
      - traefik
    healthcheck:
      test:
        ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://127.0.0.1:8787/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=traefik'

      # HTTPS router (serves the API)
      - 'traefik.http.routers.construct-api.rule=Host(`api.mehdify.com`)'
      - 'traefik.http.routers.construct-api.entrypoints=websecure'
      - 'traefik.http.routers.construct-api.tls.certresolver=letsencrypt'
      - 'traefik.http.routers.construct-api.service=construct-api'
      - 'traefik.http.services.construct-api.loadbalancer.server.port=8787'

      # HTTP router -> permanent redirect to HTTPS
      - 'traefik.http.routers.construct-api-web.rule=Host(`api.mehdify.com`)'
      - 'traefik.http.routers.construct-api-web.entrypoints=web'
      - 'traefik.http.routers.construct-api-web.middlewares=construct-api-https-redirect'
      - 'traefik.http.middlewares.construct-api-https-redirect.redirectscheme.scheme=https'
      - 'traefik.http.middlewares.construct-api-https-redirect.redirectscheme.permanent=true'

networks:
  # Shared with the Traefik reverse proxy already running on the server.
  traefik:
    external: true
    name: traefik
